name: Build independent Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project from ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -t HTPreMatchIntel_v1_0_OneUpload.zip
          unzip -q HTPreMatchIntel_v1_0_OneUpload.zip
          test -f HTPreMatchIntel_v1_0_OneUpload/settings.gradle
          test -f HTPreMatchIntel_v1_0_OneUpload/build.gradle
          test -f HTPreMatchIntel_v1_0_OneUpload/app/build.gradle
          echo "Android project extracted successfully."

      - name: Check and prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          test -d "$SDK_ROOT" || { echo 'Android SDK directory not found'; exit 1; }
          if [[ ! -f "$SDK_ROOT/platforms/android-35/android.jar" || ! -f "$SDK_ROOT/build-tools/35.0.0/aapt2" ]]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$SDKMANAGER" ]]; then
              SDKMANAGER="$(command -v sdkmanager || true)"
            fi
            [[ -n "$SDKMANAGER" ]] || { echo 'sdkmanager not found'; exit 1; }
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          test -f "$SDK_ROOT/build-tools/35.0.0/aapt2"

      - name: Compile Android APK
        working-directory: HTPreMatchIntel_v1_0_OneUpload
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload independent APK
        uses: actions/upload-artifact@v4
        with:
          name: HTPreMatchIntel_v1_0_Independent_APK
          path: HTPreMatchIntel_v1_0_OneUpload/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
